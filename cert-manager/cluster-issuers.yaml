---
# Self-signed issuer used to bootstrap private CAs, such as the Linkerd
# trust anchor and the Linkerd webhook CA.
kind: ClusterIssuer
apiVersion: cert-manager.io/v1
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
# Let's Encrypt staging. Use it to test new hostnames without using up
# production rate limits. Its certificates are not browser-trusted.
kind: ClusterIssuer
apiVersion: cert-manager.io/v1
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      # The wildcard certificate for the https-wildcard listener. Let's
      # Encrypt only issues wildcards over DNS-01, answered in Linode DNS by
      # cert-manager-webhook-linode (argocd/cert-manager.yaml). The selector
      # is more specific than the HTTP-01 solver below, so it wins for this
      # name only.
      - selector:
          dnsNames:
            - "*.ephemeral-roles.net"
        dns01:
          webhook:
            groupName: acme.slicen.me
            solverName: linode
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: public
                namespace: envoy-gateway-system
                sectionName: http
---
# Let's Encrypt production. HTTP-01 challenges are answered through the
# "http" listener of the public Envoy Gateway, and DNS-01 challenges for the
# wildcard certificate in Linode DNS.
kind: ClusterIssuer
apiVersion: cert-manager.io/v1
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      # The wildcard certificate for the https-wildcard listener. Let's
      # Encrypt only issues wildcards over DNS-01, answered in Linode DNS by
      # cert-manager-webhook-linode (argocd/cert-manager.yaml). The selector
      # is more specific than the HTTP-01 solver below, so it wins for this
      # name only.
      - selector:
          dnsNames:
            - "*.ephemeral-roles.net"
        dns01:
          webhook:
            groupName: acme.slicen.me
            solverName: linode
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: public
                namespace: envoy-gateway-system
                sectionName: http
