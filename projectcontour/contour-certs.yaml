---
# Bootstrap issuer used only to mint the Contour CA certificate below.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: contour-selfsigned-issuer
  namespace: projectcontour
spec:
  selfSigned: {}
---
# CA used to sign both the contour and envoy leaf certificates, mirroring
# what `contour certgen` produces. cert-manager renews this well before
# expiry, so it replaces the old one-shot contour-certgen Job.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: contour-ca
  namespace: projectcontour
spec:
  isCA: true
  commonName: Project Contour
  secretName: contour-ca-cert
  duration: 43800h # 5 years
  renewBefore: 2160h # 90 days
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: contour-selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: contour-ca-issuer
  namespace: projectcontour
spec:
  ca:
    secretName: contour-ca-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: contourcert
  namespace: projectcontour
spec:
  commonName: contour
  dnsNames:
    - contour
    - contour.projectcontour
    - contour.projectcontour.svc
    - contour.projectcontour.svc.cluster.local
  secretName: contourcert
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: contour-ca-issuer
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: envoycert
  namespace: projectcontour
spec:
  commonName: envoy
  dnsNames:
    - envoy
    - envoy.projectcontour
    - envoy.projectcontour.svc
    - envoy.projectcontour.svc.cluster.local
  secretName: envoycert
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: contour-ca-issuer
    kind: Issuer
    group: cert-manager.io
