---
# grafana.ephemeral-roles.net through the public Envoy Gateway. Grafana has
# its own login.
# Not generated: monitoring/generate.sh recreates manifests/, so copy this
# file back after regenerating.
#
# Every field the API server would default (group, kind, weight, the
# default path match) is spelled out. The monitoring Application diffs
# client-side, so omitted defaults would show as permanent drift.
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
      namespace: envoy-gateway-system
      sectionName: https-grafana
  hostnames:
    - grafana.ephemeral-roles.net
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: grafana
          port: 3000
          weight: 1
