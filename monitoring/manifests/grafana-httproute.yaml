---
# grafana.ephemeral-roles.net through the public Envoy Gateway. Grafana has
# its own login.
# Not generated: monitoring/generate.sh recreates manifests/, so copy this
# file back after regenerating.
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    # The monitoring Application applies server-side but diffs client-side,
    # so fields the API server defaults (group, kind, weight, the default
    # path match) would show as drift. Diff server-side for this route.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  parentRefs:
    - name: public
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - grafana.ephemeral-roles.net
  rules:
    - backendRefs:
        - name: grafana
          port: 3000
