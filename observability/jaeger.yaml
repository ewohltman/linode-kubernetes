---
apiVersion: jaegertracing.io/v1
kind: Jaeger
metadata:
  name: jaeger
  namespace: observability
spec:
  strategy: allinone
  allInOne:
    image: jaegertracing/all-in-one:1.37.0
    # The Jaeger operator adds linkerd.io/inject: disabled by default; the
    # CR's own annotations take precedence. Jaeger's UDP agent ports
    # aren't proxied (Linkerd only handles TCP).
    annotations:
      linkerd.io/inject: enabled
    options:
      log-level: info
  storage:
    type: memory
    options:
      memory:
        max-traces: 100000
  ingress:
    enabled: false

