---
# HTTP basic auth in front of the Jaeger UI, which has no login of its own.
#
# The users file isn't stored in this public repository; create the Secret
# by hand. Envoy Gateway only accepts the unsalted {SHA} (SHA-1) htpasswd
# format, so use a long random password that isn't used anywhere else:
#
#   PASS=$(openssl rand -base64 24)
#   HASH=$(printf '%s' "$PASS" | openssl dgst -binary -sha1 | openssl base64)
#   kubectl -n observability create secret generic jaeger-basic-auth \
#     --from-literal=.htpasswd="jaeger:{SHA}$HASH"
#   echo "jaeger / $PASS"    # keep this in a password manager
#
# Until the Secret exists (or if it's malformed), Envoy Gateway answers this
# route with 500, so the UI is never exposed without a password. Basic auth
# sends the password with every request; it's only safe over HTTPS (phase 4).
kind: SecurityPolicy
apiVersion: gateway.envoyproxy.io/v1alpha1
metadata:
  name: jaeger-basic-auth
  namespace: observability
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: jaeger
  basicAuth:
    users:
      name: jaeger-basic-auth
