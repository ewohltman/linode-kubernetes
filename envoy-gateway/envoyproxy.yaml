---
# Data-plane settings for the public Gateway.
kind: EnvoyProxy
apiVersion: gateway.envoyproxy.io/v1alpha1
metadata:
  name: public
  namespace: envoy-gateway-system
spec:
  # Send traffic to Service cluster IPs instead of pod IPs, so that the
  # Linkerd proxy beside Envoy does the load balancing and applies
  # Service-level policy.
  routingType: Service
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        pod:
          annotations:
            linkerd.io/inject: enabled
            # Internet traffic arrives on the listener container ports
            # (80 -> 10080, 443 -> 10443). Bypass the Linkerd proxy for it,
            # so Envoy sees the real client IP.
            config.linkerd.io/skip-inbound-ports: "10080,10443"
      envoyService:
        type: LoadBalancer
        # Keep client source IPs; traffic only goes to nodes running Envoy.
        externalTrafficPolicy: Local
        annotations:
          # Adopt the NodeBalancer Contour used, so the public IPs
          # (45.79.61.251 and 2600:3c00:1::2d4f:3dfb) and DNS stay the same.
          service.beta.kubernetes.io/linode-loadbalancer-nodebalancer-id: "250811"
          # Never delete the NodeBalancer (and lose the IPs) with this Service.
          service.beta.kubernetes.io/linode-loadbalancer-preserve: "true"
