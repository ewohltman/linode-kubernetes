---
# The cluster's single public entry point, replacing Contour.
#
# cert-manager creates one Let's Encrypt certificate per HTTPS listener
# (its certificateRefs Secret, in this namespace) and renews it
# automatically. Each HTTPS listener accepts routes only from the namespace
# of the application it serves.
kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: public
  namespace: envoy-gateway-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: envoy-gateway
  listeners:
    # Plain HTTP: cert-manager's HTTP-01 challenge routes, and the redirect
    # to HTTPS in http-redirect.yaml.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-argocd
      protocol: HTTPS
      port: 443
      hostname: argocd.ephemeral-roles.net
      tls:
        mode: Terminate
        certificateRefs:
          - name: argocd-ephemeral-roles-net-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
    - name: https-grafana
      protocol: HTTPS
      port: 443
      hostname: grafana.ephemeral-roles.net
      tls:
        mode: Terminate
        certificateRefs:
          - name: grafana-ephemeral-roles-net-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    - name: https-jaeger
      protocol: HTTPS
      port: 443
      hostname: jaeger.ephemeral-roles.net
      tls:
        mode: Terminate
        certificateRefs:
          - name: jaeger-ephemeral-roles-net-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: observability
