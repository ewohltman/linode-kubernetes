---
# ArgoCD's upstream NetworkPolicies only admit each component's own ports.
# NetworkPolicies are additive, so this one opens the Linkerd proxy ports on
# every ArgoCD pod:
# - 4191 (proxy admin: readiness/liveness probes from the kubelet, and
#   metrics scraped by linkerd-viz's Prometheus). The kubelet probes from
#   the node's IP, hence 0.0.0.0/0. With native sidecars, a proxy that
#   can't pass its probe would keep the app container from starting.
# - 4190 (tap), from linkerd-viz only.
# - 4143 (proxy inbound). When both ends are meshed, the client's proxy
#   delivers to the target pod's proxy on 4143, not to the application
#   port, so the upstream per-port policies would drop all meshed traffic
#   between ArgoCD components (the controller couldn't reach the repo
#   server). Allowed from ArgoCD's own pods, the Envoy Gateway data plane
#   and linkerd-viz. Linkerd authorization policies can narrow this further.
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: linkerd-proxy
  namespace: argocd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 4191
          protocol: TCP
      from:
        - ipBlock:
            cidr: 0.0.0.0/0
    - ports:
        - port: 4190
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkerd-viz
    - ports:
        - port: 4143
          protocol: TCP
      from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkerd-viz
