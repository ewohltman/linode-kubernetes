---
# ArgoCD's upstream NetworkPolicies only admit each component's own ports.
# NetworkPolicies are additive, so this one opens the Linkerd proxy ports on
# every ArgoCD pod:
# - 4191 (proxy admin: readiness/liveness probes from the kubelet, and
#   metrics scraped by linkerd-viz's Prometheus). The kubelet probes from
#   the node's IP, hence 0.0.0.0/0. With native sidecars, a proxy that
#   can't pass its probe would keep the app container from starting.
# - 4190 (tap), from linkerd-viz only.
# Meshed application traffic still arrives on the original application
# ports, which the upstream policies already cover.
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: linkerd-proxy
  namespace: argocd
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 4191
          protocol: TCP
      from:
        - ipBlock:
            cidr: 0.0.0.0/0
    - ports:
        - port: 4190
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: linkerd-viz
